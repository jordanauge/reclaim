[workspace]
members = ["crates/reclaim-core", "crates/reclaim-cli", "crates/reclaim-tui", "crates/reclaim-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jordan Augé"]
license = "MIT"

[workspace.dependencies]
# Utilities
anyhow      = "1"
thiserror   = "1"
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"
chrono      = { version = "0.4", features = ["serde"] }
rayon       = "1"
walkdir     = "2"
dirs        = "5"
glob        = "0.3"

serde_json  = "1"
rusqlite    = { version = "0.32", features = ["bundled"] }
seahash     = "4"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive", "color"] }

# TUI
ratatui    = "0.28"
crossterm  = "0.27"

# GUI
egui       = "0.29"
eframe     = { version = "0.29", default-features = true }
